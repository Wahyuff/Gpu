name: Windows RDP via Ngrok

on:
  workflow_dispatch: # Memungkinkan Anda menjalankan RDP secara manual

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 # Batas maksimum berjalan (6 jam)

    steps:
    - name: Menginstal Ngrok Resmi
      run: |
        choco install ngrok -y
        
    - name: Autentikasi Ngrok
      run: |
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        
    - name: Mengaktifkan Akses Remote Desktop (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        
    - name: Membuat User RDP Baru
      run: |
        # Membuat user: rdpfree dan password: drpfree@123
        net user rdpfree drpfree@123 /add
        net localgroup Administrators rdpfree /add
        net localgroup "Remote Desktop Users" rdpfree /add
        
    - name: Membuka Tunnel dan Menampilkan Informasi Koneksi
      run: |
        # Mengaktifkan logging ngrok ke file teks (ngrok.log) untuk menghindari error port 4040
        Start-Process ngrok -ArgumentList "tcp 3389 --region=ap --log=stdout" -RedirectStandardOutput "ngrok.log"
        
        # Jeda waktu 15 detik agar koneksi terbentuk sempurna
        Start-Sleep -Seconds 15
        
        # Membaca isi log dan menyaring teks alamat URL ngrok secara otomatis
        $logContent = Get-Content ngrok.log
        $ngrok_url = ($logContent | Select-String -Pattern "url=tcp://").Line
        if ($ngrok_url -match "url=(tcp://[^\s]+)") {
            $rdp_address = $Matches[1]
        } else {
            $rdp_address = "GAGAL MENDAPATKAN URL. Cek tab log di bawah!"
        }
        
        Write-Host "========================================="
        Write-Host "ALAMAT KONEKSI RDP: $rdp_address"
        Write-Host "USERNAME: rdpfree"
        Write-Host "PASSWORD: drpfree@123"
        Write-Host "========================================="
        
        # Cetak seluruh log ngrok ke layar untuk mempermudah pengecekan manual jika terjadi kendala
        Write-Host "--- DETAIL LOG NGROK ---"
        Get-Content ngrok.log
        Write-Host "------------------------"
        
        # Menjaga agar komputer virtual tidak langsung mati
        Start-Sleep -Seconds 21600
