name: Windows RDP via Pinggy Realtime

on:
  workflow_dispatch: # Memungkinkan Anda menjalankan RDP secara manual

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 # Batas maksimum berjalan (6 jam)

    steps:
    - name: Mengaktifkan Akses Remote Desktop (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        
    - name: Membuat User RDP Baru
      run: |
        # Membuat user: rdpfree dan password: drpfree@123
        net user rdpfree drpfree@123 /add
        net localgroup Administrators rdpfree /add
        net localgroup "Remote Desktop Users" rdpfree /add
        
    - name: Membuka Tunnel dan Menampilkan Informasi Koneksi
      run: |
        Write-Host "========================================="
        Write-Host "USERNAME: rdpfree"
        Write-Host "PASSWORD: drpfree@123"
        Write-Host "========================================="
        Write-Host "ALAMAT RDP AKAN MUNCUL DI BAWAH INI SECARA REAL-TIME:"
        Write-Host "-----------------------------------------------------"
        
        # Perbaikan Total: Menjalankan SSH langsung di terminal utama tanpa dialihkan ke file teks.
        # Menambahkan parameter '-t -t' untuk memaksa alokasi TTY virtual agar SSH tidak crash di GitHub Actions.
        ssh -t -t -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:127.0.0.1:3389 tcp+tcp@free.pinggy.io
