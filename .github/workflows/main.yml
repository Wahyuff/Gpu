name: Windows RDP via Ngrok

on:
  workflow_dispatch: # Memungkinkan Anda menjalankan RDP secara manual

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 # Batas maksimum berjalan (6 jam)

    steps:
    - name: Menginstal Ngrok Resmi
      run: |
        # Menggunakan Chocolatey untuk menjamin ngrok terinstal dengan benar tanpa error link download
        choco install ngrok -y
        
    - name: Autentikasi Ngrok
      run: |
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        
    - name: Mengaktifkan Akses Remote Desktop (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        
    - name: Membuat User RDP Baru
      run: |
        # Membuat user: rdpfree dan password: drpfree@123
        net user rdpfree drpfree@123 /add
        net localgroup Administrators rdpfree /add
        net localgroup "Remote Desktop Users" rdpfree /add
        
    - name: Membuka Tunnel dan Menampilkan Informasi Koneksi
      run: |
        # Membuka tunnel dengan protokol TCP ke port RDP (3389) menggunakan region Asia
        Start-Process ngrok -ArgumentList "tcp 3389 --region=ap"
        
        # Jeda waktu 15 detik agar sistem ngrok siap dan stabil
        Start-Sleep -Seconds 15
        
        # Mengambil alamat IP/Host publik dari API internal ngrok yang sedang berjalan
        $ngrok_url = (Invoke-WebRequest -Uri http://127.0.0 | ConvertFrom-Json).tunnels.public_url
        
        Write-Host "========================================="
        Write-Host "ALAMAT KONEKSI RDP: $ngrok_url"
        Write-Host "USERNAME: rdpfree"
        Write-Host "PASSWORD: drpfree@123"
        Write-Host "========================================="
        
        # Menjaga agar komputer virtual tidak langsung mati selama 6 jam
        Start-Sleep -Seconds 21600
