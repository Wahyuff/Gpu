name: RDP Indonesia Server

on:
  workflow_dispatch: # Memungkinkan Anda menjalankan RDP secara manual

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360 # Batas maksimum dari GitHub adalah 6 jam

    steps:
      - name: Mengubah Region dan Zona Waktu ke Indonesia
        run: |
          Write-Host "Mengubah Zona Waktu ke WIB (SE Asia Standard Time)..."
          Set-TimeZone -Id "SE Asia Standard Time"

          Write-Host "Mengubah Regional Format ke Indonesia (id-ID)..."
          Set-Culture id-ID
          Set-WinSystemLocale id-ID
          
          Write-Host "Mengubah Lokasi Geografis (GeoID) ke Indonesia..."
          Set-WinHomeLocation -GeoId 111
          
          Write-Host "=== Verifikasi Pengaturan ==="
          Get-TimeZone
          Get-Culture
          Get-WinHomeLocation

      - name: Configure Core RDP Settings By Yamzz
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          # Memastikan firewall Windows di server membuka port untuk komunikasi secara penuh
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          netsh advfirewall firewall add rule name="Tailscale-UDP" dir=in action=allow protocol=UDP localport=41641

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          $username = "DenzzNOV"
          $password = "DenzzNO@123"
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          
          if (-not (Get-LocalUser -Name $username)) {
              exit 1
          }

      - name: Install Tailscale Resmi via Chocolatey
        run: |
          # Menggunakan Choco memastikan installer menunggu sampai selesai dan terdaftar di PATH otomatis
          choco install tailscale -y

      - name: Establish Tailscale Connection
        run: |
          # Membuka port UDP 41641 agar Tailscale dapat membentuk jalur interkoneksi langsung (Direct P2P)
          # Karena sudah masuk PATH lewat Choco, panggil langsung perintah 'tailscale'
          tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=abdulhalim --port=41641
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
              $tsIP = tailscale ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP Terdeteksi: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              exit 1
          }
          Write-Host "Koneksi RDP siap dialihkan via Tailscale!"

      - name: Maintain Connection
        run: |
          Write-Host "`n========================================="
          Write-Host "KONEKSI RDP SILAKAN REMOTE LEWAT:"
          Write-Host "ALAMAT/IP: abdulhalim (Atau gunakan IP Tailscale di log atas)"
          Write-Host "USERNAME: DenzzNOV"
          Write-Host "PASSWORD: DenzzNO@123"
          Write-Host "=========================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Server Tetap Aktif..."
              Start-Sleep -Seconds 300
          }
